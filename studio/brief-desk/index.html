<style>
/* The director's desk: write and direct on the left, the style library on the right, the reel of picks at the bottom.
   Every colour, face, size and easing is a token below; nothing outside this block names a colour or a face.
   Brand tokens (DIRECTION.md) as opaque OKLCH, each measured over the page colour. */
:root {
  color-scheme: dark;
  --color-paper: oklch(15.7% 0.056 259.9);       /* page #010B24 */
  --color-paper-2: oklch(22.2% 0.047 265.0);     /* soft white 6% over the page */
  --color-paper-3: oklch(26.0% 0.045 267.0);     /* soft white 10%: pressed and hover */
  --color-raised: oklch(24.1% 0.098 263.8);      /* night deep #061A4D */
  --color-raised-2: oklch(32.4% 0.141 263.7);    /* night mid #0A2A7A */
  --color-ink: oklch(100% 0 89.9);               /* ink #FFFFFF */
  --color-ink-2: oklch(71.2% 0.015 268.4);       /* second ink, white 62% */
  --color-rule: oklch(31.9% 0.039 268.1);        /* line, white 16% */
  --color-rule-strong: oklch(53.5% 0.025 268.2); /* control edges, white 40% */
  --color-accent: oklch(92.6% 0.139 136.5);      /* lime #BBFC9E */
  --color-accent-ink: oklch(14.8% 0.023 255.1);  /* on-accent #050B14 */
  --color-warm: oklch(79.7% 0.164 69.8);         /* amber #FFA724: clashes and made on request only */
  --color-azure: oklch(58.0% 0.229 263.7);       /* #2E6BFF: one bloom only */
  --color-notice: oklch(80.0% 0.090 250.0);      /* a light azure: the brief's notes and "not connected", never amber */
  --color-focus: oklch(92.6% 0.139 136.5);
  --color-scrim: oklch(10% 0.04 260 / 0.72);
  --color-shadow: oklch(8% 0.05 262 / 0.55);
  --font-display: "Chakra Petch", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-swash: "My Soul", "Chakra Petch", cursive;
  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 1rem;
  --text-md: 1.1875rem;
  --text-display-s: clamp(1.75rem, 1.25rem + 1.6vw, 2.5rem);
  --text-display: clamp(2.5rem, 1.7rem + 3vw, 4rem);
  --leading-display: 0.92;
  --tracking-display: -0.03em;
  --space-3xs: 0.25rem;
  --space-2xs: 0.5rem;
  --space-xs: 0.75rem;
  --space-sm: 1rem;
  --space-md: 1.5rem;
  --space-lg: 2rem;
  --space-xl: 3rem;
  --radius: 4px;
  --radius-pill: 999px;
  --rule-w: 1px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-over: cubic-bezier(0.34, 1.56, 0.64, 1);

  --dur-short: 220ms;
  --dur-long: 420ms;

  --z-bar: 10;
  --z-tray: 20;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-base); line-height: 1.55; font-variant-numeric: tabular-nums; }

  background:

    radial-gradient(36rem 28rem at -8% 108%, color-mix(in oklch, var(--color-raised-2) 55%, transparent), transparent 70%);

h1, h2, h3, h4, p, ul, ol, dl, figure { margin: 0; }

.h3 { font-size: var(--text-md); font-weight: 500; line-height: 1.3; }
.label { font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); }
.muted { color: var(--color-ink-2); }
.small { font-size: var(--text-sm); }
.lede { color: var(--color-ink-2); max-width: 46ch; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }

/* ---------- Brand bar ---------- */
.bar {
  position: sticky; top: 0; z-index: var(--z-bar); height: var(--bar-h);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs);
  padding-inline: max(var(--space-sm), env(safe-area-inset-left)) max(var(--space-sm), env(safe-area-inset-right));

  border: var(--rule-w) solid var(--color-rule-strong); border-radius: var(--radius); background: var(--color-paper-2); color: var(--color-ink-2); white-space: nowrap;

@media (min-width: 30rem) { .kbar { padding-left: var(--space-xs); } .kbar-text, .kbar .kbd { display: inline; } }
@media (hover: hover) { .kbar:hover { background: var(--color-paper-3); border-color: var(--color-ink-2); color: var(--color-ink); } }

@media (min-width: 60rem) { .status { display: inline-flex; } }

/* ---------- Buttons ---------- */
.btn, #view .primary, #view .secondary {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2xs);
  min-height: 2.75rem; padding: 0 var(--space-md); border-radius: var(--radius);
  border: var(--rule-w) solid var(--color-rule-strong); background: transparent; color: var(--color-ink); font-weight: 500; white-space: nowrap;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
@media (hover: hover) { .btn:hover, #view .secondary:hover { background: var(--color-paper-2); border-color: var(--color-ink-2); } }
.btn:active, #view .primary:active, #view .secondary:active { transform: translateY(1px); }
.btn:disabled, #view button:disabled { opacity: 0.5; cursor: progress; transform: none; }
#view .primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
@media (hover: hover) { #view .primary:hover { background: var(--color-ink); border-color: var(--color-ink); } }
.btn--sm { min-height: 2.25rem; padding: 0 var(--space-sm); font-size: var(--text-sm); }

.btn[data-state="success"] { border-color: var(--color-accent); color: var(--color-accent); }

.icon-btn {
  position: relative; display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; flex: 0 0 auto;
  border-radius: var(--radius); border: var(--rule-w) solid transparent; background: transparent; color: var(--color-ink-2);
  transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
@media (hover: hover) { .icon-btn:hover { background: var(--color-paper-2); color: var(--color-ink); } }
.icon-btn:active { transform: translateY(1px); }
.icon-btn svg { width: 1.125rem; height: 1.125rem; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.link, #view .link { background: none; border: 0; padding: 0; color: var(--color-accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; font-weight: 500; white-space: nowrap; }
@media (hover: hover) { .link:hover { color: var(--color-ink); } }

/* ---------- Desk ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1fr); }
.pane { min-width: 0; padding: var(--space-lg) max(var(--space-sm), env(safe-area-inset-left)) calc(var(--tray-h) + var(--space-xl)); }
.pane--write { display: grid; gap: var(--space-xl); align-content: start; }
.pane--library { border-top: var(--rule-w) solid var(--color-rule); display: grid; gap: var(--space-lg); align-content: start; }
@media (min-width: 40rem) { .pane { padding-inline: var(--space-lg); } }
@media (min-width: 64rem) {
  .desk { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); height: calc(100dvh - var(--bar-h)); }
  .pane { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--color-rule) transparent; }
  .pane--library { border-top: 0; border-left: var(--rule-w) solid var(--color-rule); background: color-mix(in oklch, var(--color-raised) 30%, transparent); }
}
@media (min-width: 90rem) { .desk { grid-template-columns: minmax(0, 4.4fr) minmax(0, 7.6fr); } }

/* ---------- The brief (left pane): the brief desk's own flow ---------- */
#view { display: grid; gap: var(--space-xl); min-width: 0; }
#view section { display: grid; gap: var(--space-sm); min-width: 0; }
#view h1 { font-family: var(--font-display); font-weight: 500; font-size: var(--text-display-s); line-height: var(--leading-display); letter-spacing: var(--tracking-display); text-transform: uppercase; overflow-wrap: anywhere; text-wrap: balance; }

  width: 100%; border: var(--rule-w) solid var(--color-rule-strong); border-radius: var(--radius); background: var(--color-paper-2); color: var(--color-ink);
  padding: var(--space-xs) var(--space-sm); resize: vertical; transition: border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}

#view .chip-on { display: inline-flex; align-items: center; gap: var(--space-xs); justify-self: start; font-size: var(--text-sm); border: var(--rule-w) solid var(--color-accent); color: var(--color-accent); border-radius: var(--radius-pill); padding: var(--space-3xs) var(--space-2xs) var(--space-3xs) var(--space-xs); }

#view .idea { text-align: left; padding: var(--space-xs) var(--space-sm); border: var(--rule-w) solid var(--color-rule); border-radius: var(--radius); background: transparent; color: var(--color-ink); line-height: 1.4; transition: border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out); }
@media (hover: hover) { #view .idea:hover { border-color: var(--color-accent); background: var(--color-paper-2); } }
#view .idea .muted { display: block; font-size: var(--text-sm); margin-top: 2px; }

#view .change-item .idea { width: 100%; }
#view .briefs { list-style: none; margin: 0; padding: 0; border-top: var(--rule-w) solid var(--color-rule); }
#view .briefs li { border-bottom: var(--rule-w) solid var(--color-rule); }
#view .brief-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3xs) var(--space-sm); align-items: center; text-align: left; background: none; color: var(--color-ink); border: 0; padding: var(--space-sm) 2px; }

/* The opening */

.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }

  border: var(--rule-w) solid var(--color-rule-strong); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink);

  transition: border-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}

  view: 'start',          // start | questions | plan | handoff | parked
  host: 'pending',        // pending | ready | none
  mcp: null, sample: null, db: null,
  ctx: null,              // studio_context reply
  ideas: null,            // [{ text, fill, style, job }]
  words: '', style: null, // the start box and a saved style picked from an idea
  briefWords: '', confirmedOn: null,
  job: null, check: null, plan: null, done: null, parkedNext: null,
  drafts: {},             // question id -> { value, words }
  notes: {},              // area -> { tone, text }
  busy: null,             // the action running, so its button shows it
  saved: [], copyText: null, watchingDb: false,
  changing: false,        // the plan's "Change something" list is open
  engaged: false,         // the customer has clicked once: only then is Claude asked to reword the ideas
};
let mcpReady = null;

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const codeOf = (e) => (e && typeof e.code === 'string' ? e.code : 'upstream_error');
const payloadOf = (r) => (r && typeof r === 'object' && 'payload' in r ? r.payload : r);
const cut = (s, n) => (String(s).length > n ? `${String(s).slice(0, n - 1)}…` : String(s));
const setNote = (area, note) => { if (note) state.notes[area] = note; else delete state.notes[area]; };
const visibleQuestions = (check) => (check?.questions || []).filter((q) => !(Array.isArray(q.choices) && q.choices.length === 0));
const stageLabel = (s) => { const t = String(s || 'brief').replace(/[_-]+/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };
const dateLabel = (d) => { const t = new Date(`${d}T12:00:00`); return Number.isNaN(t.getTime()) ? String(d) : t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };

/* ---------- Connector calls ---------- */

// One call site per tool. Each returns the raw result; read() and write() unwrap the payload.
const connector = {
  context: () => state.mcp.callTool(HOST, 'studio_context', {}),
  start: (words, style) => state.mcp.callTool(HOST, 'brief_start', style ? { words, style } : { words }),
  check: (job) => state.mcp.callTool(HOST, 'brief_check', { job }),
  answer: (input) => state.mcp.callTool(HOST, 'brief_answer', input),
  plan: (job) => state.mcp.callTool(HOST, 'brief_plan', { job }),
  confirm: (job) => state.mcp.callTool(HOST, 'brief_confirm', { job }),
  reopen: (job, item) => state.mcp.callTool(HOST, 'brief_reopen', { job, item }),
  pick: (input) => state.mcp.callTool(HOST, 'brief_pick', input),
  direct: (input) => state.mcp.callTool(HOST, 'brief_direct', input),
  suggest: (input) => state.mcp.callTool(HOST, 'styles_suggest', input),
};

/** A read: retried once after a short random delay when the studio did not answer. */
async function read(call) {
  try { return payloadOf(await call()); } catch (e) {
    if (codeOf(e) !== 'server_unavailable') throw e;
    await wait(Math.min(Number(e.retryAfterMs) || 0, 60000) + 300 + Math.random() * 700);
    return payloadOf(await call());
  }
}
/** A write: runs once, only from a click, never retried by the page. */
async function write(call) { return payloadOf(await call()); }

/** The tool's own words from a tool error (its result's text), else the error's message. */
function toolText(e) {
  const content = e && e.result && Array.isArray(e.result.content) ? e.result.content : [];
  const text = content.map((c) => (c && typeof c.text === 'string' ? c.text : '')).filter(Boolean).join(' ').trim();
  return text || String((e && e.message) || '');
}

/** What to tell the customer for each error code. `fallback` switches the page to the no-studio mode. */
function explain(e, { isWrite = false } = {}) {
  switch (codeOf(e)) {
    case 'server_not_connected': case 'not_granted': case 'capability_disabled': case 'capability_removed':
      return { fallback: true };
    case 'cancelled':
      return { tone: 'warm', text: 'You said no in the Claude app, so nothing was saved. Click again and choose Allow to go ahead.' };
    case 'approval_required':
      return { tone: 'warm', text: 'The Claude app needs your OK for this step. Click again and choose Allow when it asks.' };
    case 'tool_error':
      return { tone: 'warm', text: toolText(e) || 'The studio could not do that.' };
    case 'server_unavailable':
      return isWrite
        ? { tone: 'warm', text: 'The studio did not answer in time, so this may or may not have gone through. The page has checked again: look at what it shows before you click a second time.' }
        : { tone: 'warm', text: 'The studio did not answer. Wait a moment, then try again.' };
    case 'not_in_manifest': case 'blocked_by_policy':
      return { tone: 'warm', text: 'This page is not allowed to reach your studio in this view. Open it in the Claude desktop app with the studio folder open.' };
    case 'needs_reauth':
      return { tone: 'warm', text: 'The link to your studio needs setting up again. Restart the Claude desktop app with the studio folder open.' };
    case 'rate_limited':
      return { tone: 'warm', text: 'Too many requests at once. Wait a few seconds, then try again.' };
    default:
      return { tone: 'warm', text: 'Something went wrong reaching your studio. Try again in a moment.' };
  }
}

async function failed(e, area, { isWrite = false } = {}) {
  const x = explain(e, { isWrite });
  if (x.fallback) { enterNoHost(); return; }
  setNote(area, x);
  if (isWrite && codeOf(e) === 'server_unavailable') await recheck();
}

/** After a write the studio may or may not have done: read the current state again. */
async function recheck() {
  try {
    if (state.job) applyCheck(await read(() => connector.check(state.job)), { keepView: true });
    else state.ctx = await read(() => connector.context());
  } catch { /* the note already says to look before trying again */ }
}

/* ---------- Actions (writes run only from these click handlers) ---------- */

async function startBrief() {
  const words = state.words.trim();
  if (!words) { setNote('start', { tone: 'warm', text: 'Write a sentence or two about the video first.' }); render(); return; }
  setNote('start', null);
  state.busy = 'start'; render();
  if (state.host === 'pending' && mcpReady) await mcpReady;
  if (state.host !== 'ready') { state.busy = null; await saveWithoutStudio(words); return; }
  const held = state.picks.slice(); // picks made before the brief existed are saved to it once it starts
  try {
    const reply = await write(() => connector.start(words, state.style));
    state.briefWords = words; state.confirmedOn = null; state.words = ''; state.style = null; state.drafts = {};
    const heldFor = state.dir.kept === 'held' ? state.dir.words.trim() : null;
    applyCheck(reply);
    if (held.length) await sendHeldPicks(held);
    await sendHeldChips();
    if (heldFor !== null && heldFor === words) await keepDirectorBrief();
    else if (heldFor !== null) { state.dir = freshDir(); state.dirSeq += 1; } // it was made for other words
    refreshSuggestionsSoon();
  } catch (e) { await failed(e, 'start', { isWrite: true }); }
  state.busy = null; render();
}

async function openBrief(item) {
  resetDirector();
  state.busy = `open:${item.job}`; setNote('briefs', null); render();
  try {
    const reply = await read(() => connector.check(item.job));
    state.briefWords = item.words || ''; state.confirmedOn = item.confirmed || null; state.drafts = {}; state.plan = null;
    applyCheck(reply);
  } catch (e) { await failed(e, 'briefs'); }
  state.busy = null; render(); toTop();
}

async function answerCard(q) {
  const area = `card:${q.id}`;
  const d = draftOf(q);
  const words = d.words.trim();
  const input = { job: state.job, question: q.id };
  if (!q.choices) {
    if (!words) { setNote(area, { tone: 'warm', text: 'Write your answer in the box first.' }); render(); return; }
    input.words = words;
  } else if (words && (!(d.value || []).length || !d.touched)) {
    // Their own words, and no card they picked themselves (the recommended one shown is not their pick): Claude
    // proposes the card when it can, and the connector checks it. Without a proposal the words go alone.
    state.busy = area; render();
    const value = await proposeChoice(q, words);
    if (value != null) input.value = q.many ? [value] : value;
    input.words = words;
  } else {
    const value = q.many ? d.value : d.value?.[0];
    if (value == null || (Array.isArray(value) && value.length === 0)) { setNote(area, { tone: 'warm', text: 'Pick one of the cards, or say it in your own words.' }); render(); return; }
    input.value = value;
    if (words) input.words = words;
  }
  setNote(area, null);
  state.busy = area; render();
  try {
    const reply = await write(() => connector.answer(input));
    if (reply.recorded) delete state.drafts[q.id];
    else setNote(area, { tone: 'warm', text: reply.reason || 'That answer was not saved. Pick one of the cards.' });
    applyCheck(reply, { keepView: true });
  } catch (e) { await failed(e, area, { isWrite: true }); }
  state.busy = null; render();
}

async function showPlan() {
  state.busy = 'plan'; setNote('plan', null); render();
  try { state.plan = await write(() => connector.plan(state.job)); state.view = 'plan'; state.changing = false; toTop(); }
  catch (e) { await failed(e, 'plan', { isWrite: true }); }
  state.busy = null; render();
}

async function confirmPlan() {
  state.busy = 'confirm'; setNote('confirm', null); render();
  try {
    const reply = await write(() => connector.confirm(state.job));
    if (reply.stage == null) { state.parkedNext = reply.next; state.view = 'parked'; } else { state.done = reply; state.view = 'handoff'; }
    toTop();
  } catch (e) { await failed(e, 'confirm', { isWrite: true }); }
  state.busy = null; render();
}

async function reopenItem(item) {
  state.busy = `reopen:${item}`; clearReopenNotes(); render();
  try {
    const reply = await write(() => connector.reopen(state.job, item));
    state.plan = null; state.changing = false;
    applyCheck(reply);
    toTop();
  } catch (e) { await failed(e, `reopen:${item}`, { isWrite: true }); } // a refusal (a saved style's item) shows by that item
  state.busy = null; render();
}

const clearReopenNotes = () => { for (const area of Object.keys(state.notes)) if (area.startsWith('reopen:')) delete state.notes[area]; };

function applyCheck(reply, { keepView = false } = {}) {
  state.job = reply.job; state.check = reply;
  if (Array.isArray(reply.picks)) state.picks = reply.picks.map((p) => (p.stale ? { tab: p.tab, id: p.id, name: p.name, stale: true } : { tab: p.tab, id: p.id }));
  if (reply.understood && typeof reply.understood === 'object') state.understood = reply.understood;
  paintPicks();
  const ids = new Set((reply.questions || []).map((q) => q.id));
  for (const id of Object.keys(state.drafts)) if (!ids.has(id)) delete state.drafts[id];
  for (const area of Object.keys(state.notes)) if (area.startsWith('card:') && !ids.has(area.slice(5))) delete state.notes[area];
  if (!keepView || state.view === 'questions') state.view = reply.parked && visibleQuestions(reply).length === 0 ? 'parked' : 'questions';
}

async function goHome() {
  if (state.job) { state.picks = []; state.libNote = null; paintPicks(); } // those picks belong to the brief just left
  resetDirector();
  state.view = 'start'; state.job = null; state.check = null; state.plan = null; state.done = null; state.parkedNext = null; state.changing = false;
  state.notes = {}; render(); toTop();
  if (state.host === 'ready') await loadContext();
}

function useIdea(idea) {
  if (idea.job) { openBrief({ job: idea.job, words: idea.words }); return; }
  state.words = idea.fill || idea.text; state.style = idea.style || null;
  hearWords(); render();
  const box = document.getElementById('brief-words');
  if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}

/* ---------- The studio's memory and ideas ---------- */

async function loadContext() {
  try {
    state.ctx = await read(() => connector.context());
    state.ideas = buildIdeas(state.ctx);
    setNote('briefs', null);
    render();
    rewordIdeas();
  } catch (e) { await failed(e, 'briefs'); render(); }
}

/** Up to four plain ideas from what the studio remembers. */
function buildIdeas(ctx) {
  const ideas = [];
  const style = (ctx.styles || [])[0];
  if (style) {
    const name = String(style.ref).split('/')[1].replace(/-/g, ' ');
    ideas.push({ text: `Next episode in your saved ${name} style`, fill: `The next episode in our saved ${name} style, about `, style: style.ref });
  }
  const withFilm = (ctx.brands || []).find((b) => (b.last_films || []).length);
  const film = withFilm?.last_films[0];
  if (film?.look) ideas.push({ text: `A different look from your last film (${film.look})`, fill: `A new video for ${withFilm.name} in a different look from our last film, which used the ${film.look} look` });
  if (film?.name) ideas.push({ text: `A follow-up to ${cut(film.name, 60)}`, fill: `A follow-up to ${film.name} for ${withFilm.name}, showing ` });
  const open = (ctx.briefs || []).find((b) => !b.confirmed && b.open > 0 && !b.parked);
  if (open) ideas.push({ text: `Finish your brief: ${cut(open.words || open.job, 70)}`, job: open.job, words: open.words });
  return ideas.slice(0, 4);
}

/** With Claude available, and once the customer has clicked, reword the idea lines in one call; any problem keeps
 *  the plain lines. */
async function rewordIdeas() {
  const ideas = state.ideas;
  if (!state.engaged || !state.sample || !ideas || !ideas.length) return;
  try {
    const out = await state.sample.json([
      'Reword each idea below as one short, friendly suggestion for a marketer starting a new video.',
      'Keep every fact (names, looks, styles). Plain words, sentence case, at most 80 characters each, same order.',
      `Ideas: ${JSON.stringify(ideas.map((i) => i.text))}`,
      'Answer as JSON: {"ideas": ["<idea 1>", "<idea 2>", ...]} with exactly the same number of ideas.',
    ].join('\n'));
    const lines = out && Array.isArray(out.ideas) ? out.ideas : null;
    if (state.ideas !== ideas || !lines || lines.length !== ideas.length || !lines.every((l) => typeof l === 'string' && l.trim() && l.length <= 100)) return;
    state.ideas = ideas.map((idea, i) => ({ ...idea, text: lines[i].trim() }));
    render();
  } catch (e) { sampleFailed(e); }
}

/** Claude picks one of the card's values for the customer's words, or null. */
async function proposeChoice(q, words) {
  if (!state.sample) return null;
  try {
    const out = await state.sample.json([
      'A customer is answering one question about a video they want made. Pick the one choice that matches what they wrote, or null if none clearly fits.',
      `Question: ${q.question}`,
      `Choices: ${JSON.stringify(q.choices.map((c) => ({ value: c.value, label: c.label })))}`,
      `Customer's words: ${JSON.stringify(words)}`,
      'Answer as JSON: {"value": "<one of the choice values, or null>"}',
    ].join('\n'));
    const v = out && typeof out.value === 'string' ? out.value : null;
    return q.choices.some((c) => c.value === v) ? v : null;
  } catch (e) { sampleFailed(e); return null; }
}

function sampleFailed(e) {
  // Codes that mean Claude is not available in this view hide its uses for good; anything else skips this one time.
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(codeOf(e))) state.sample = null;
}

/* ---------- Without the studio: save the words to the page's own store ---------- */

function enterNoHost() {
  state.host = 'none'; state.mcp = null;
  if (state.view !== 'start') { state.words = state.words || state.briefWords; state.view = 'start'; }
  watchSaved();
  render();
}

function watchSaved() {
  if (!state.db || state.watchingDb) return;
  state.watchingDb = true;
  try {
    state.db.collection('briefs').onSnapshot((snap) => {
      state.saved = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.at).localeCompare(String(a.at)));
      render();
    }, () => { state.watchingDb = false; });
  } catch { state.watchingDb = false; }
}

async function saveWithoutStudio(words) {
  const director = state.dir.kept === 'held' && state.dir.words.trim() === words.trim() ? state.dir : null;
  if (!state.db) { state.copyText = director ? `${words}\n\n${directorText(director)}` : words; setNote('start', { tone: 'warm', text: 'This page cannot keep your brief here. Copy it and paste it into a new chat in the studio folder.' }); render(); return; }
  state.busy = 'start'; render();
  const id = `b${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const doc = { words, at: new Date().toISOString(), status: 'waiting', style_picks: state.picks.map((p) => ({ tab: p.tab, id: p.id })) };
  if (director) doc.director_brief = canonicalDirector(director);
  const save = () => state.db.collection('briefs').doc(id).set(doc);
  try {
    try { await save(); } catch (e) { if (codeOf(e) !== 'unavailable') throw e; await wait(300 + Math.random() * 700); await save(); }
    state.words = ''; state.copyText = null; state.savedId = id; state.savedDoc = doc;
    paintPicks();
    setNote('start', { tone: 'good', text: 'Saved. Next time you open a chat in the studio folder and say "make a video", Claude finds this brief and carries on from it.' });
    watchSaved();
  } catch (e) {
    state.copyText = director ? `${words}\n\n${directorText(director)}` : words;
    const full = ['quota_exceeded', 'resource_exhausted'].includes(codeOf(e));
    setNote('start', { tone: 'warm', text: full ? 'The page\'s store is full, so your brief was not saved here. Copy it and paste it into a new chat in the studio folder.' : 'Your brief could not be saved here. Copy it and paste it into a new chat in the studio folder.' });
  }
  state.busy = null; render();
}

async function copyWords(text, box) {
  try { await navigator.clipboard.writeText(text); setNote('copy', { tone: 'good', text: 'Copied.' }); }
  catch { box.focus(); box.select(); setNote('copy', { tone: 'warm', text: 'Copying was blocked here. The text is selected: copy it with your keyboard.' }); }
  render();
}

/* ---------- Render ---------- */

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const noteEl = (area) => { const n = state.notes[area]; return n ? h('p', { class: 'note', 'data-tone': n.tone || null, role: 'status', text: n.text }) : null; };
const busyLabel = (key, idle, busy) => (state.busy === key ? busy : idle);

function render() {
  const active = document.activeElement;
  const focusId = active && active.id;
  const sel = focusId && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;

  const status = document.getElementById('status');
  status.dataset.host = state.host;
  status.textContent = { pending: 'Connecting to your studio', ready: 'Connected to your studio', none: 'Not connected to your studio' }[state.host];
  document.getElementById('home').hidden = state.view === 'start';

  const view = document.getElementById('view');
  const build = { start: renderStart, questions: renderQuestions, plan: renderPlan, handoff: renderHandoff, parked: renderParked }[state.view];
  view.replaceChildren(...build().filter(Boolean));

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus({ preventScroll: true }); if (sel && 'setSelectionRange' in el) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* not a text field */ } }
  }
}

function renderStart() {
  const ctx = state.ctx;
  const names = (ctx?.brands || []).map((b) => b.name);
  let welcome = 'Welcome to your video studio.';
  if (state.host === 'ready' && ctx) welcome = names.length ? `Welcome back. Your studio has ${names.join(', ')} set up.` : 'Welcome to your video studio. Write your brief now; setting up your brand comes next.';

  const box = h('textarea', { id: 'brief-words', rows: '4', 'aria-describedby': 'brief-help', placeholder: 'For example: a 20 second vertical demo of our new export button, for agency owners who still send reports by hand',
    oninput: (e) => { state.words = e.target.value; scheduleRead(); } });
  box.value = state.words;

  const noHost = state.host === 'none';
  const form = h('form', { class: 'start', onsubmit: (e) => { e.preventDefault(); startBrief(); } },
    h('section', { class: 'intro' },
      h('p', { class: 'eyebrow', text: welcome }),
      h('h1', { class: 'display' }, 'Start with a ', h('span', { class: 'swash', 'aria-hidden': 'true', text: 'S' }), h('span', { class: 'sr-only', text: 'S' }), 'entence'),
      h('p', { class: 'lede', text: 'Say it rough. The director turns it into shots, timing and sound, and the library shows you the looks.' })),
    h('section', {},
      noHost ? h('div', { class: 'note', 'data-tone': 'warm' },
        h('p', {}, h('strong', { text: 'This page works in the Claude desktop app with your studio folder open.' })),
        h('p', { class: 'muted', text: 'In the app, approve "damex-engine" when it asks. If it never asks, or the page still does not connect, run the start step again.' }),
        h('p', { class: 'muted', text: state.db ? 'You can still write your brief here. It is saved with this page, and your next chat in the studio folder picks it up.' : 'You can still write your brief here, then copy it into a new chat in the studio folder.' })) : null,
      h('div', { class: 'field' }, h('label', { class: 'field-label', for: 'brief-words', text: 'What video do you want to make?' }), box,
        h('p', { class: 'helper', id: 'brief-help', text: 'Links to films you like can go right in here. Files and footage are added in chat: say "I have a file to add".' })),
      state.style ? h('span', { class: 'chip-on' }, `Using your saved ${String(state.style).split('/')[1].replace(/-/g, ' ')} style`,
        h('button', { type: 'button', 'aria-label': 'Stop using the saved style', text: 'Remove', onclick: () => { state.style = null; render(); } })) : null,
      h('div', { class: 'row' },
        h('button', { type: 'submit', class: 'primary', id: 'start-brief', disabled: state.busy === 'start' || null,
          text: busyLabel('start', noHost ? (state.db ? 'Save my brief' : 'Get my brief to copy') : 'Start the brief', noHost ? 'Saving…' : 'Starting…') })),
      noteEl('start'),
      state.copyText ? copyBox(state.copyText) : null));

  const ideas = !noHost && state.ideas && state.ideas.length ? state.ideas : STARTERS;
  const ideaList = h('section', { 'aria-labelledby': 'ideas-h' },
    h('h2', { id: 'ideas-h', text: ideas === STARTERS ? 'Not sure where to start? Try one of these' : 'Ideas from your studio' }),
    h('div', { class: 'ideas' }, ideas.map((idea, i) => h('button', { type: 'button', class: 'idea', id: `idea-${i}`, onclick: () => useIdea(idea) },
      idea.text, idea.job ? h('span', { class: 'muted', text: 'Opens the brief where you left it' }) : null))));

  return [form, understoodSection(), directorSection(), stripEl(null), ideaList, noHost ? savedList() : briefList()];
}

function copyBox(text) {
  const area = h('textarea', { id: 'copy-words', rows: '4', readonly: true, 'aria-label': 'Your brief, to copy' });
  area.value = text;
  return h('div', { class: 'copybox' }, area,
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'secondary', id: 'copy-btn', text: 'Copy my brief', onclick: () => copyWords(text, area) })),
    noteEl('copy'));
}

function briefList() {
  const briefs = state.ctx?.briefs || [];
  if (state.host !== 'ready' || (!briefs.length && !state.notes.briefs)) return null;
  return h('section', { 'aria-labelledby': 'briefs-h' },
    h('h2', { id: 'briefs-h', text: 'Your briefs' }),
    noteEl('briefs'),
    briefs.length ? h('ul', { class: 'briefs' }, briefs.map((b) => {
      let meta = `${stageLabel(b.stage)} stage`;
      if (b.confirmed) meta += `, confirmed ${dateLabel(b.confirmed)}`;
      else if (b.parked) meta = 'Waiting for your brand to be set up';

/** The library as read from the publish set: { tabs: { <tab>: [entries] }, meta, brief, suggest } (the two modules). */
function libLoaded({ tabs, meta, brief = null, suggest = null, prompt = null }) {

/** A pick whose style is no longer in the library, as an entry the reel and pickToggle can use (it can only be removed). */
function stalePick(id) {
  const p = state.picks.find((x) => x.id === id);
  return p ? { id: p.id, tab: p.tab, name: p.name || p.id, family: null, stale: true, filters: {}, preview: {} } : null;
}
/** The reel's picks: a style that is not in the library shows as gone only when the studio said so or the library has
 *  loaded; while it loads (or did not load) the pick is shown as it was saved. */
function reelItems() {
  return state.picks.map((p) => entryOf(p.id) || (p.stale || state.lib.status === 'ready'
    ? stalePick(p.id)
    : { id: p.id, tab: p.tab, name: p.name || 'A picked style', pending: true, stale: false, filters: {}, preview: {} })).filter(Boolean);
}
function reelFrameHTML(e) {
  if (e.pending) return `<div class="frame" role="listitem"><div class="pv" aria-hidden="true"></div><span class="fname">${esc(e.name)}</span><button class="icon-btn" type="button" data-action="unpick" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`;
  if (e.stale) return `<div class="frame" role="listitem"><div class="pv pv--words" aria-hidden="true"><div class="wave wave--none">${waveBars(e.id, true)}</div></div><span class="fname">${esc(e.name)}</span><span class="avail avail--mor">No longer in the library</span><button class="icon-btn" type="button" data-action="unpick" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`;
  return `<div class="frame" role="listitem">${previewHTML(e, 'thumb')}<span class="fname">${esc(e.name)}</span>${availHTML(e, { line: false })}<button class="icon-btn" type="button" data-action="unpick" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`;

function paletteItemHTML(e, i) {
  return `<li role="option" id="po-${esc(e.id)}" data-id="${esc(e.id)}" aria-selected="${i === pal.idx}"><span class="pn">${esc(e.name)}</span><span class="pt">${esc(tabName(e.tab))}</span><span class="pdesc">${esc(e.line)}</span></li>`;

/* ---------- Picks: one per family (a swap), three per tab, clashes refused ---------- */

/** What the brief's own rules (brief.mjs setPick) say against picking this entry, with `kin` swapped out; or null. */
function pickProblem(entry, kin) {
  const rules = state.lib.brief;
  if (!rules || typeof rules.setPick !== 'function') return null;
  try { rules.setPick({ style_picks: state.picks.filter((p) => !kin || p.id !== kin.id) }, entry, true, state.lib.byId); return null; }
  catch (e) { return String(e.message || e); }
}

/** Saves one pick through the connector; the reply is a full brief check, so the brief flow updates with it. */
async function savePick(entry, on) {
  const reply = await write(() => connector.pick({ job: state.job, tab: entry.tab, id: entry.id, on }));
  if (Array.isArray(reply.picks)) state.picks = reply.picks.map((p) => (p.stale ? { tab: p.tab, id: p.id, name: p.name, stale: true } : { tab: p.tab, id: p.id }));
  applyCheck(reply, { keepView: true });
  return { ok: reply.picked === on, reason: reply.reason || null };
}

function refusePick(entry, reason) {
  state.libNote = { id: entry.id, tone: 'warm', text: reason || 'That style could not be picked.' };
  announce(`${entry.name} was not picked. ${state.libNote.text}`);
}

/** Picks the entry, or removes it when picked. With the studio connected it saves through brief_pick; without it the
 *  pick is held with the brief and saved to the page's store with it, as the brief desk saves briefs. */
async function pickToggle(entry) {
  if (!entry || state.libBusy) return;
  const on = !isPicked(entry.id);
  const kin = on ? state.picks.find((p) => p.tab === entry.tab && p.id !== entry.id && entryOf(p.id)?.family === entry.family) || null : null;
  const kinEntry = kin ? entryOf(kin.id) : null;
  state.libNote = null;
  if (on) {
    const reason = pickProblem(entry, kin);
    if (reason) { refusePick(entry, reason); paintPicks(); return; }
  }
  state.libBusy = entry.id; paintPicks();
  let kinOff = false; // the old pick of a swap is off and the new one not yet on
  try {
    if (state.host === 'ready' && state.mcp && state.job) {
      if (kinEntry) {
        const off = await savePick(kinEntry, false);
        if (!off.ok) { refusePick(entry, off.reason); return; }
        kinOff = true;
      }
      const r = await savePick(entry, on);
      kinOff = false;
      if (!r.ok) {
        if (kinEntry) await savePick(kinEntry, true).catch(() => {});
        refusePick(entry, r.reason);
        return;
      }
    } else {
      const rest = state.picks.filter((p) => p.id !== entry.id && (!kin || p.id !== kin.id));
      state.picks = on ? [...rest, { tab: entry.tab, id: entry.id }] : rest;
      if (state.host === 'none' && state.db && state.savedId) await savePicksWithBrief();
    }
    if (kinEntry) {
      state.libNote = { id: entry.id, tone: 'info', text: `Swapped ${kinEntry.name} for ${entry.name}. One pick per family, and both are ${lowerFirst(entry.family)} styles.`, undo: kinEntry.id };
      announce(`Swapped ${kinEntry.name} for ${entry.name}.`);
    } else announce(on ? `${entry.name} added to your reel.` : `${entry.name} removed from your reel.`);
  } catch (e) {
    const x = explain(e, { isWrite: true });
    if (kinOff) { // a swap never loses the earlier pick: put it back, here at least when the studio cannot be reached
      const back = await savePick(kinEntry, true).then((r) => r.ok, () => false);
      if (!back && !isPicked(kinEntry.id)) state.picks = [...state.picks, { tab: kinEntry.tab, id: kinEntry.id }];
    }
    if (x.fallback) { enterNoHost(); return; }
    if (state.host === 'ready' && state.mcp && state.job) await recheck(); // the note says the page has checked again
    refusePick(entry, x.text);
  } finally {
    state.libBusy = null;
    paintPicks();
  }
}

/** Without the studio, a brief already saved on this page carries its picks. Only the picks change: with a store that
 *  can update one field, only style_picks is written; otherwise the document is written again from what was saved
 *  (and from the latest snapshot, when one has come), so neither its words nor anything the chat added is lost. */
async function savePicksWithBrief() {
  await updateSavedBrief({ style_picks: state.picks.map((p) => ({ tab: p.tab, id: p.id })) });
}
/** Changes some fields of the brief saved on this page: update when the store can, else the saved document (with the
 *  latest snapshot over it) written again with the fields, so its words and anything the chat added stay. */
async function updateSavedBrief(fields) {
  const ref = state.db.collection('briefs').doc(state.savedId);
  if (typeof ref.update === 'function') { await ref.update(fields); return; }
  const { id: _id, ...seen } = state.saved.find((d) => d.id === state.savedId) || {};
  const doc = { ...(state.savedDoc || {}), ...seen, ...fields };
  await ref.set(doc);
  state.savedDoc = doc;
}

/** After the brief starts in the studio, picks made before it are saved to it, one by one. */
async function sendHeldPicks(held) {
  for (const p of held) {
    const e = entryOf(p.id);
    if (!e || state.picks.some((x) => x.id === p.id)) continue;
    state.libBusy = e.id; paintPicks();
    try { const r = await savePick(e, true); if (!r.ok) refusePick(e, r.reason); } catch (err) { refusePick(e, explain(err, { isWrite: true }).text); break; } finally { state.libBusy = null; }
  }
  paintPicks();
}

/* ---------- Painting (only with a real document) ---------- */

function paintLibrary(swap = false) { if (!canPaint) return; renderTabs(); renderFilters(); renderGrid(swap); renderReel(); }

function renderTabs() {
  const counts = state.lib.meta?.counts || {};
  $('#tabs').innerHTML = LIB_TABS.map((t) => {
    const sel = t.id === state.libView.tab;
    const n = state.picks.filter((p) => p.tab === t.id).length;
    const total = counts[t.id]?.total ?? (state.lib.tabs[t.id] || []).length;
    return `<button class="tab" role="tab" type="button" id="tab-${t.id}" aria-controls="libpanel" aria-selected="${sel}" tabindex="${sel ? 0 : -1}" data-action="tab" data-tab="${t.id}">${t.name}${state.lib.status === 'ready' ? `<span class="n">${total}</span>` : ''}${n ? `<span class="pk">${n} picked</span>` : ''}</button>`;
  }).join('');
  $('#libpanel').setAttribute('aria-labelledby', `tab-${state.libView.tab}`);
}

function renderFilters() {
  const v = state.libView;
  if (state.lib.status !== 'ready') { $('#filters').innerHTML = ''; return; }
  const fam = state.lib.meta?.counts?.[v.tab]?.families || {};
  const kinds = (state.lib.brief?.KINDS || Object.keys(KIND_LABELS)).filter((k) => KIND_LABELS[k]);
  const sizes = (state.lib.brief?.SIZES || Object.keys(SIZE_LABELS)).filter((k) => SIZE_LABELS[k]);
  const any = v.energy.length || v.ready || v.kind || v.size || v.family || v.query;
  const opt = (val, label, cur) => `<option value="${esc(val)}"${val === cur ? ' selected' : ''}>${esc(label)}</option>`;
  $('#filters').innerHTML = `
    <div class="frow" role="group" aria-label="Energy"><span class="label">Energy</span>${LIB_ENERGIES.map((en) => `<button class="fchip" type="button" data-action="f-energy" data-v="${en}" aria-pressed="${v.energy.includes(en)}">${capFirst(en)}</button>`).join('')}</div>
    <div class="frow" role="group" aria-label="Ready now or made on request"><span class="label">Made</span><button class="fchip" type="button" data-action="f-ready" data-v="ready" aria-pressed="${v.ready === 'ready'}">Ready now</button><button class="fchip" type="button" data-action="f-ready" data-v="mor" data-tone="warm" aria-pressed="${v.ready === 'mor'}">Made on request</button></div>
    <div class="fselects">
      <label class="fsel"><span class="label">Kind of film</span><select class="select" data-filter="kind">${opt('', 'Any kind', v.kind)}${kinds.map((k) => opt(k, KIND_LABELS[k], v.kind)).join('')}</select></label>
      <label class="fsel"><span class="label">Size</span><select class="select" data-filter="size">${opt('', 'Any size', v.size)}${sizes.map((k) => opt(k, SIZE_LABELS[k], v.size)).join('')}</select></label>
      <label class="fsel fsel--wide"><span class="label">Family</span><select class="select" data-filter="family">${opt('', 'Every family', v.family)}${Object.entries(fam).map(([f, n]) => opt(f, `${f} (${n})`, v.family)).join('')}</select></label>
    </div>
    <div class="fbar">
      <div class="search-wrap"><label class="sr-only" for="lib-q">Search ${esc(tabWord(v.tab))} styles</label><input class="search" id="lib-q" type="search" placeholder="Search ${esc(tabWord(v.tab))} styles" value="${esc(v.query)}" autocomplete="off"></div>
      <span class="count" id="count" aria-live="polite"></span>
      ${any ? '<button class="link" type="button" data-action="f-clear">Clear filters</button>' : ''}
    </div>`;
}

function filtered() {
  const v = state.libView;
  const q = v.query.trim().toLowerCase();
  return (state.lib.tabs[v.tab] || []).filter((e) => {
    const f = e.filters || {};
    return (!v.energy.length || (f.energy || []).some((en) => v.energy.includes(en)))
      && (!v.ready || (v.ready === 'ready' ? f.ready === true : f.ready !== true))
      && (!v.kind || (f.kinds || []).includes(v.kind))
      && (!v.size || (f.sizes || []).includes(v.size))
      && (!v.family || e.family === v.family)
      && (!q || `${e.name} ${e.line} ${e.family}`.toLowerCase().includes(q));
  });
}

function renderGrid(swap = true) {
  const panel = $('#libpanel');
  const paint = () => {
    if (state.lib.status === 'loading' || state.lib.status === 'idle') {
      panel.innerHTML = `<p class="sr-only">Loading the style library</p><div class="grid" aria-hidden="true">${'<div class="skel-card"></div>'.repeat(6)}</div>`;
      return;
    }
    if (state.lib.status === 'error') {
      panel.innerHTML = '<div class="lib-note" role="alert"><strong>The style library did not load</strong><span>The styles could not be read from this page. Your brief is kept. Try again, or reload the page.</span><div class="row"><button class="btn btn--sm" type="button" data-action="lib-retry">Try again</button></div></div>';
      return;
    }
    const list = filtered();
    const v = state.libView;
    const total = state.lib.meta?.counts?.[v.tab]?.total ?? (state.lib.tabs[v.tab] || []).length;
    const any = v.energy.length || v.ready || v.kind || v.size || v.family || v.query;
    const count = $('#count');
    if (count) count.innerHTML = any ? `<b>${list.length}</b> of ${total} styles` : `<b>${total}</b> styles`;
    v.list = list;
    v.shown = Math.min(list.length, CHUNK);
    if (!list.length) {
      panel.innerHTML = `<div class="empty"><strong>No styles match these filters</strong><span>Try another energy or kind of film, or clear the filters to see every ${esc(tabWord(v.tab))} style.</span><button class="btn btn--sm" type="button" data-action="f-clear">Clear filters</button></div>`;
      return;
    }
    panel.innerHTML = `<div class="grid" id="grid">${list.slice(0, v.shown).map(cardHTML).join('')}</div><div class="grid-more" id="grid-more"></div>`;
    watchClips(panel);
    watchMore();
  };
  const g = $('#grid');
  if (swap && g && !reduceMotion()) {
    g.classList.add('is-swapping');
    setTimeout(() => { paint(); const ng = $('#grid'); if (ng) { ng.classList.add('is-swapping'); requestAnimationFrame(() => requestAnimationFrame(() => ng.classList.remove('is-swapping'))); } }, 90);
  } else paint();
}

/** More cards as the end of the grid comes into view: a tab's cards are made on demand, not all at once. */
let moreObserver = null;
let moreRoot;
function watchMore() {
  const s = $('#grid-more');
  if (moreObserver) moreObserver.disconnect();
  if (!s) return;
  if (typeof IntersectionObserver !== 'function') { appendCards(Infinity); return; }
  moreRoot = libScrollRoot();
  moreObserver = new IntersectionObserver((items) => { if (items.some((i) => i.isIntersecting)) appendCards(CHUNK); }, { root: moreRoot, rootMargin: '600px 0px' });
  moreObserver.observe(s);
}
function appendCards(n) {
  const v = state.libView;
  const g = $('#grid');
  if (!g || v.shown >= v.list.length) { if (moreObserver) moreObserver.disconnect(); return; }
  const next = v.list.slice(v.shown, v.shown + n);
  v.shown += next.length;
  g.insertAdjacentHTML('beforeend', next.map(cardHTML).join(''));
  watchClips(g);
  if (v.shown >= v.list.length && moreObserver) moreObserver.disconnect();
}

/* Clips: loaded when near the view, played only on hover or focus, paused when out of view. */
let clipObserver = null;
let clipRoot;
/** The library pane when it scrolls by itself (wide screens), else the window. */
function libScrollRoot() {
  const pane = $('#library');
  return pane && getComputedStyle(pane).overflowY === 'auto' ? pane : null;
}
function clipObserverFor() {
  const root = libScrollRoot();
  if (clipObserver && clipRoot === root) return clipObserver;
  if (clipObserver) clipObserver.disconnect();
  clipRoot = root;
  clipObserver = new IntersectionObserver((items) => {
    for (const it of items) {
      const v = it.target;
      if (it.isIntersecting) loadClip(v);
      else if (!v.paused) stopClip(v);
    }
  }, { root, rootMargin: '300px 0px' });
  $$('#library video.clip[data-src]:not([data-thumb])').forEach((v) => clipObserver.observe(v));
  return clipObserver;
}
/* Thumbnails (reel, pairs) sit outside the library pane, so they are watched against the window, and never play. */
let thumbObserver = null;
function watchThumbs(scope) {
  const vids = $$('video.clip[data-thumb]:not([data-watched])', scope);
  if (typeof IntersectionObserver !== 'function') { vids.forEach(loadClip); return; }
  thumbObserver = thumbObserver || new IntersectionObserver((items) => { for (const it of items) if (it.isIntersecting) { loadClip(it.target); thumbObserver.unobserve(it.target); } }, { rootMargin: '200px' });
  for (const v of vids) { v.dataset.watched = '1'; thumbObserver.observe(v); }
}
function watchClips(scope) {
  const vids = $$('video.clip[data-src]:not([data-watched]):not([data-thumb])', scope);
  if (typeof IntersectionObserver !== 'function') { vids.forEach(loadClip); return; }
  const o = clipObserverFor();
  for (const v of vids) { v.dataset.watched = '1'; o.observe(v); }
}
function loadClip(v) {
  if (!v.getAttribute('src') && v.dataset.src) { v.preload = 'metadata'; v.src = v.dataset.src; }
}
function playClip(v) {
  if (!v || reduceMotion()) return;
  if (typeof loadClip === 'function' && v.dataset) loadClip(v);
  try { const p = v.play(); if (p && typeof p.catch === 'function') p.catch(() => {}); } catch { /* not playable here */ }
}
function stopClip(v) {
  if (!v) return;
  try { v.pause(); if (v.readyState > 0) v.currentTime = POSTER_AT; } catch { /* nothing to stop */ }
}
let liveCard = null;
function cardEnter(card) {
  if (liveCard === card) return;
  cardLeave(liveCard);
  liveCard = card;
  if (card) playClip($('video.clip', card));
}
function cardLeave(card) {
  if (!card) return;
  stopClip($('video.clip', card));
  if (liveCard === card) liveCard = null;
}

/* Sound: the shared sprite, decoded once; a slice under half a second plays two or three times so it can be heard. */
const sound = { ctx: null, buf: null, map: null, loading: null, nodes: [], id: null, timer: null };
async function spriteReady() {
  if (sound.buf) return;
  if (!sound.loading) {
    sound.loading = (async () => {

    if (words.length && !words.every((w) => hay.includes(w))) continue;

    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn btn--sm btn--primary', text: 'Save change', onclick: () => { if (String(input.value).trim()) changeChip(field, input.value); } }), close));
}
/** A changed chip. Before the brief exists it steers the suggestions and the director, and is saved when the brief
 *  starts; after, size, kind, voice and length are answers to the brief (brief_answer). */
async function changeChip(field, value) {
  state.chipOpen = null;
  const v = field === 'length' ? Number(String(value).replace(/\D+$/, '')) : String(value).trim();
  if (state.job && state.host === 'ready' && state.mcp && ANSWERABLE[field]) {
    setNote('chips', null);
    try {
      const reply = await write(() => connector.answer({ job: state.job, question: ANSWERABLE[field], value: field === 'length' ? String(v) : v }));
      if (!reply.recorded) setNote('chips', { tone: 'warm', text: reply.reason || 'That change was not saved.' });
      applyCheck(reply, { keepView: true });
    } catch (e) { await failed(e, 'chips', { isWrite: true }); }
    render(); refreshSuggestionsSoon();
    return;
  }
  state.chipEdits = { ...state.chipEdits, [field]: v };
  state.understood = { ...state.heard, ...state.chipEdits };

}
/** Changed chips go to the new brief as answers, where the brief has a question for them. */
async function sendHeldChips() {
  const edits = Object.entries(state.chipEdits).filter(([f]) => ANSWERABLE[f]);
  for (const [f, v] of edits) {
    try { await write(() => connector.answer({ job: state.job, question: ANSWERABLE[f], value: f === 'length' ? String(v) : v })); } catch { /* the question is asked again below */ }
  }
  state.chipEdits = {};
  if (edits.length) await recheck();
}

/* The director's brief, made with the page's sample capability */

async function directorNotes() {
  if (state.directorNotes) return state.directorNotes;
  const r = await fetch('styles/director.md');
  if (!r.ok) throw new Error('The director notes could not be read');
  state.directorNotes = await r.text();
  return state.directorNotes;
}
async function askClaude(prompt, signal) {
  const sm = state.sample;
  if (!sm) throw Object.assign(new Error('No sample'), { code: 'not_granted' });
  if (typeof sm.json === 'function') return sm.json(prompt, signal ? { signal } : undefined);
  const text = await sm.text(prompt, signal ? { signal } : undefined);
  const m = /\{[\s\S]*\}/.exec(String(text || ''));
  return JSON.parse(m ? m[0] : 'null');
}
const pickedEntries = () => state.picks.map((p) => entryOf(p.id)).filter(Boolean);
const pickedEngine = () => [...new Set(pickedEntries().flatMap((e) => e.engine_names || []))];
// The names the library's styles use that read as engine names (brief.mjs isEngineName). Plain words such as "camera"
// or "Button" are also names in the registry, but in a director's brief they are just words.
const libraryEngine = () => {
  const rules = state.lib.brief;
  if (!rules || typeof rules.isEngineName !== 'function') return [];
  return [...new Set(state.lib.all.flatMap((e) => e.engine_names || []))].filter((n) => rules.isEngineName(n));
};
/** The energy the customer gave (the chips, or the brief's assumption), if any. */
function energyNow() {
  return state.understood?.energy || state.check?.assumed?.find((a) => a.id === 'energy')?.value || null;
}
/** The energy the beats are checked against: the customer's, else the one the director named for this take. */
const filmEnergy = () => energyNow() || state.dir.energy || null;
const ENERGY_WORDS = () => state.lib.brief?.ENERGIES || [];
function studioSummary() {
  const c = state.ctx || {};
  return { brands: (c.brands || []).map((b) => ({ name: b.name, last_films: (b.last_films || []).slice(0, 3).map((f) => ({ name: f.name, look: f.look })) })), saved_styles: (c.styles || []).map((x) => x.ref) };
}
function directorPrompt(notes, words) {
  const picks = pickedEntries();
  return [
    notes, '', '## This film',
    `The customer's words: ${JSON.stringify(words)}`,
    `What the studio understood: ${JSON.stringify(state.understood || {})}`,
    `Energy: ${energyNow() || 'not said: choose one from the words and the picks, and name it in "energy"'}`,
    `Picked styles:${picks.length ? '' : ' none'}`,
    ...picks.map((e) => `- ${e.name} (${tabName(e.tab)}):\n${promptText(e)}\n  engine: ${(e.engine_names || []).join(', ') || 'none'}`),
    `The studio: ${JSON.stringify(studioSummary())}`,
  ].join('\n');
}
const cleanBeats = (b) => (Array.isArray(b) ? b.map((x) => ({ at_s: Number(x?.at_s), what: String(x?.what ?? '') })) : b);
function partsOf(out) {
  const o = out && typeof out === 'object' && !Array.isArray(out) ? out : {};
  return Object.fromEntries(directorParts().filter((k) => Object.hasOwn(o, k)).map((k) => [k, k === 'beats' ? cleanBeats(o[k]) : o[k]]));
}
/** brief.mjs checkDirectorBrief, with the energy, the names the library uses, and the picks' names. */
function checkParts(parts, energy = filmEnergy()) {
  const rules = state.lib.brief;
  if (!rules || typeof rules.checkDirectorBrief !== 'function') return { ok: false, reason: 'The page cannot check the brief here.', part: null };
  return rules.checkDirectorBrief(parts, { energy, names: libraryEngine(), allowed: pickedEngine() });
}
/** A new director call: the one before it is aborted, and its reply will be dropped. */
function directorCall(words = '') {
  if (state.dirAbort) try { state.dirAbort.abort(); } catch { /* already done */ }
  state.dirAbort = typeof AbortController === 'function' ? new AbortController() : null;
  return { seq: ++state.dirSeq, job: state.job, words: String(words).trim(), signal: state.dirAbort ? state.dirAbort.signal : undefined };
}
// Still current: no newer call, and the same brief. A call made before the brief existed stays current when the brief
// just started is the one made from its words.
const stillCurrent = (call) => call.seq === state.dirSeq
  && (call.job === state.job || (call.job === null && !!state.job && String(state.briefWords || '').trim() === call.words));
/** Another brief is shown: the director's brief, the changed chips and any call in flight belong to the one before. */
function resetDirector() {
  if (state.dirAbort) try { state.dirAbort.abort(); } catch { /* already done */ }
  state.dirAbort = null;
  state.dirSeq += 1;
  state.dir = freshDir();
  state.chipEdits = {};
  state.chipOpen = null;
  setNote('sharpen', null); setNote('director-keep', null);
}
/** Why a take was not taken, in plain words. */
function takeReason(e) {
  if (codeOf(e) === 'rate_limited') return 'Claude is busy just now: wait a few seconds, then try again.';
  return e && e.plain ? String(e.message) : '';
}
const plainError = (message) => Object.assign(new Error(message), { plain: true });
/** The director's brief as plain text, for the copy box. */
function directorText(d) {
  return ["The director's brief", ...directorParts().map((k) => (k === 'beats' ? `${partLabel(k)}:\n${beatsText(d.parts.beats)}` : `${partLabel(k)}: ${d.parts[k]}`))].join('\n');
}
/** The director's brief as brief_direct stores it. */
const canonicalDirector = (d) => ({ parts: d.parts, engine: d.keptEngine || [], energy: d.energy || energyNow() || null, at: new Date().toISOString() });

async function sharpen() {
  const words = currentWords().trim();
  if (wordCount(words) < 3) { setNote('sharpen', { tone: 'warm', text: 'Write a sentence or two about the video first.' }); render(); return; }
  setNote('sharpen', null);
  const call = directorCall(words);
  const mine = { ...freshDir(), status: 'loading', words };
  state.dir = mine;
  announce('The director is working on your brief.');
  render();
  // A dropped reply never leaves the section busy: if this call's loading state is still shown, it is cleared.
  const drop = () => { if (state.dir === mine) { state.dir = freshDir(); render(); } };
  try {
    const out = await askClaude(directorPrompt(await directorNotes(), words), call.signal);
    if (!stillCurrent(call)) { drop(); return; } // a newer take was asked for, or another brief is open
    const parts = partsOf(out);
    const named = out && ENERGY_WORDS().includes(out.energy) ? out.energy : null;
    const energy = energyNow() || named;
    if (!energy) throw plainError('The director did not say which energy the film runs at.');
    const r = checkParts(parts, energy);
    if (!r.ok) throw plainError(r.reason);
    const engine = Array.isArray(out.engine) ? out.engine.filter((n) => typeof n === 'string') : [];
    state.dir = { ...freshDir(), status: 'ready', words, parts, engine, energy, states: Object.fromEntries(directorParts().map((k) => [k, 'proposed'])) };
    announce("The director's brief is ready.");
  } catch (e) {
    if (!stillCurrent(call)) { drop(); return; }
    sampleFailed(e);
    state.dir = { ...freshDir(), status: 'error', words, reason: takeReason(e) };
    announce(`${TAKE_FAILED} ${state.dir.reason || ''}`.trim());
  }
  render();
}

function partKeep(part) {
  const d = state.dir;
  d.states[part] = d.states[part] === 'kept' ? 'proposed' : 'kept';
  d.editing = null; d.settled = true; render();
}
const beatsText = (beats) => (beats || []).map((b) => `${b.at_s} s: ${b.what}`).join('\n');
function beatsFrom(text) {
  const out = [];
  for (const line of String(text).split('\n').map((l) => l.trim()).filter(Boolean)) {
    const m = /^(\d+(?:\.\d+)?)\s*s?\s*[:,]\s*(.+)$/.exec(line);
    if (!m) return null;
    out.push({ at_s: Number(m[1]), what: m[2].trim() });
  }
  return out;
}
/** The customer's own wording for one part, checked like the rest before it is taken. */
function partChange(part, text) {
  const d = state.dir;
  const value = part === 'beats' ? beatsFrom(text) : String(text).trim();
  const next = { ...d.parts, [part]: value };
  const r = value ? checkParts(next) : { ok: false, reason: part === 'beats' ? 'Write each beat on its own line, as "3 s: what happens"' : `${partLabel(part)} is missing` };
  if (!r.ok) { d.partNotes = { ...d.partNotes, [part]: r.reason }; render(); return; }
  d.parts = next; d.states[part] = 'changed'; d.editing = null; d.editText = null; d.settled = true;
  d.partNotes = { ...d.partNotes, [part]: null };
  render();
}
/** Another take of one part only: a new sample call for that part, checked with the rest before it is shown. */
async function swapPart(part) {
  const d = state.dir;
  if (d.status !== 'ready' || d.busyPart) return;
  d.busyPart = part; d.editing = null; d.settled = true;
  d.partNotes = { ...d.partNotes, [part]: null };
  const call = directorCall(d.words);
  render();
  const drop = () => { if (state.dir === d) { d.busyPart = null; render(); } };
  try {
    const prompt = [directorPrompt(await directorNotes(), d.words), '', '## Another take',
      `The brief as it stands: ${JSON.stringify(d.parts)}`,
      `Energy: ${filmEnergy()}`,
      `Write one different take of the part "${part}" only. Keep the other parts as they are. Reply with JSON only: {"${part}": ...}`].join('\n');
    const out = await askClaude(prompt, call.signal);
    if (!stillCurrent(call) || state.dir !== d) { drop(); return; }
    const has = out && typeof out === 'object' && Object.hasOwn(out, part);
    if (!has) throw plainError(`There was no new ${partLabel(part).toLowerCase()} in it.`);
    const next = { ...d.parts, [part]: part === 'beats' ? cleanBeats(out[part]) : out[part] };
    const r = checkParts(next);
    if (!r.ok) throw plainError(r.reason);
    d.parts = next; d.states[part] = 'swapped';
    announce(`Another take of ${partLabel(part).toLowerCase()} is in.`);
  } catch (e) {
    if (!stillCurrent(call) || state.dir !== d) { drop(); return; }
    sampleFailed(e);
    d.partNotes = { ...d.partNotes, [part]: `${TAKE_FAILED} ${takeReason(e)}`.trim() };
    announce(d.partNotes[part]);
  }
  d.busyPart = null;
  render();
}
/** "Keep this brief": saved through brief_direct with engine names only from the picks. Before the brief exists it is
 *  held and saved when the brief starts; without the studio it is saved with the brief on this page. */
async function keepDirectorBrief() {
  const d = state.dir;
  if (d.status !== 'ready') return;
  const r = checkParts(d.parts);
  if (!r.ok) { setNote('director-keep', { tone: 'warm', text: r.reason }); render(); return; }
  const allowed = new Set(pickedEngine());
  const engine = d.engine.filter((n) => allowed.has(n));
  setNote('director-keep', null);
  d.settled = true;
  if (state.host === 'ready' && state.mcp && state.job) {
    d.saving = true; render();
    try {
      const reply = await write(() => connector.direct({ job: state.job, parts: d.parts, engine }));
      if (reply.kept) { d.kept = 'saved'; setNote('director-keep', { tone: 'good', text: 'Kept with your brief. The studio reads it as your direction for the three concepts.' }); }
      else { d.kept = false; setNote('director-keep', { tone: 'warm', text: reply.reason || 'The studio did not keep it. Try again.' }); }
      applyCheck(reply, { keepView: true });
    } catch (e) { await failed(e, 'director-keep', { isWrite: true }); }
    d.saving = false; render();
    return;
  }
  // Without the studio: it goes with the brief saved on this page only when it was made for that brief's words.
  const forSaved = state.host === 'none' && state.db && state.savedId && String(state.savedDoc?.words || '').trim() === d.words.trim();
  if (state.host === 'none' && state.savedId && !forSaved && String(state.words || '').trim() !== d.words.trim()) {
    d.kept = false;
    setNote('director-keep', { tone: 'warm', text: "This director's brief was made for other words than the brief saved on this page, so it was not kept. Sharpen again for the brief you want." });
    render();
    return;
  }
  d.kept = 'held'; d.keptEngine = engine;
  if (forSaved) {
    try { await updateSavedBrief({ director_brief: canonicalDirector(d) }); } catch { setNote('director-keep', { tone: 'warm', text: 'It could not be saved on this page. Copy your brief into a new chat in the studio folder.' }); render(); return; }
  }
  const where = state.host === 'none'
    ? (forSaved ? 'Kept with the brief saved on this page.' : state.db ? 'Kept. It is saved with your brief when you save it.' : 'Kept. It goes in the copy box with your brief.')
    : 'Kept. It is saved with your brief when you start it.';
  setNote('director-keep', { tone: 'good', text: where });
  render();
}

function directorSection() {
  if (!state.sample || !directorParts().length) return null;
  const d = state.dir;
  const label = d.status === 'loading' ? 'Directing…' : d.status === 'ready' ? 'Sharpen again' : d.status === 'error' ? 'Try again' : 'Sharpen with the director';
  return h('section', { class: 'director', 'aria-labelledby': 'dir-h' },
    h('div', { class: 'stack-xs' }, h('h2', { id: 'dir-h', text: "The director's brief" }),
      h('p', { class: 'small muted', text: 'Your words stay as they are. The director writes a shot-by-shot brief beside them: keep, change or swap each part.' })),
    state.confirmedOn ? null : h('div', { class: 'direct-row' }, h('button', { type: 'button', class: 'btn btn--direct', id: 'sharpen', disabled: d.status === 'loading' || null, text: label, onclick: sharpen })),
    noteEl('sharpen'),
    h('div', { id: 'director' }, directorBody())); // status is said through announce(), not a region rebuilt each render
}
function directorBody() {
  const d = state.dir;
  if (d.status === 'loading') {
    return h('div', { class: 'thinking', 'aria-busy': 'true' }, h('p', { class: 'label', text: 'The director is working through your brief' }),
      h('ol', {}, ['Reading your words', 'Timing the beats to the energy', 'Following your picked styles', 'Writing camera, motion, type and sound'].map((t) => h('li', { text: t }))));
  }
  if (d.status === 'error') return h('div', { class: 'note', 'data-tone': 'warm' }, h('strong', { text: TAKE_FAILED }), d.reason ? h('span', { text: d.reason }) : null, h('span', { text: 'Your words are kept as they are.' }));

    if (!kept) return null;
    return h('div', { class: 'note', 'data-tone': 'good' }, h('strong', { text: "A director's brief is kept with this brief" }),
      h('dl', { class: 'kept-parts' }, directorParts().filter((k) => kept[k] != null).flatMap((k) => [h('dt', { text: partLabel(k) }),
        h('dd', { text: k === 'beats' && Array.isArray(kept.beats) ? kept.beats.map((b) => `${b.at_s} s: ${b.what}`).join('; ') : String(kept[k]) })])));
  }
  const n = (s) => directorParts().filter((k) => d.states[k] === s).length;
  const words = currentWords().trim();
  return h('article', { class: `dbrief${d.settled ? ' is-settled' : ''}` },
    h('div', { class: 'dbrief-head' },
      h('p', { class: 'small muted', text: `${directorParts().length} parts: ${n('kept')} kept, ${n('changed')} changed, ${n('swapped')} swapped, ${n('proposed')} to review.` }),
      h('p', { class: 'label', text: 'Your words' }), h('p', { class: 'yours', text: d.words }),
      words && words !== d.words ? h('p', { class: 'note', 'data-tone': 'warm', text: 'Your words changed since this brief. Sharpen again to bring it in line with them.' }) : null),
    directorParts().map((part) => partEl(part)),
    state.confirmedOn ? null : h('div', { class: 'dbrief-foot' },
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn btn--primary', id: 'keep-director', disabled: d.saving || null, text: d.saving ? 'Keeping…' : d.kept ? 'Keep this brief again' : 'Keep this brief', onclick: keepDirectorBrief })),
      noteEl('director-keep')));
}
function partEl(part) {
  const d = state.dir;
  const title = partLabel(part);
  const v = d.parts[part];

  let body;
  if (d.editing === part) {
    const box = h('textarea', { id: `ed-${part}`, 'aria-label': `Change ${title.toLowerCase()}`, oninput: (e) => { d.editText = e.target.value; } });
    box.value = d.editText != null ? d.editText : part === 'beats' ? beatsText(v) : String(v ?? '');
    body = h('div', { class: 'edit-box' }, box,
      part === 'beats' ? h('p', { class: 'small muted', text: 'One beat per line, as "3 s: what happens".' }) : null,
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn btn--sm btn--primary', text: 'Save change', onclick: () => partChange(part, box.value) }),
        h('button', { type: 'button', class: 'btn btn--sm btn--quiet', text: 'Cancel', onclick: () => { d.editing = null; d.editText = null; render(); } })));
  } else if (part === 'beats') {
    body = h('ol', { class: 'beats', role: 'list' }, (v || []).map((b) => h('li', {}, h('span', { class: 't', text: `${b.at_s} s` }), h('span', { text: b.what }))));
  } else body = h('p', { class: 'ptext', text: String(v ?? '') });
  return h('div', { class: 'dpart', 'data-part': part },
    h('div', { class: 'dpart-head' },
      h('div', { class: 'dpart-title' }, h('h3', { text: title }), h('span', { class: 'pstate', 'data-s': d.states[part], text: busy ? 'Writing another take…' : STATE_LABEL[d.states[part]] || '' })),
      state.confirmedOn ? null : h('div', { class: 'dpart-acts', role: 'group', 'aria-label': title },
        h('button', { type: 'button', class: 'seg', id: `keep-${part}`, 'aria-pressed': String(d.states[part] === 'kept'), text: 'Keep', onclick: () => partKeep(part) }),
        h('button', { type: 'button', class: 'seg', id: `change-${part}`, 'aria-expanded': String(d.editing === part), text: 'Change', onclick: () => { d.editing = d.editing === part ? null : part; d.editText = null; d.settled = true; render(); } }),
        h('button', { type: 'button', class: 'seg', id: `swap-${part}`, disabled: !!d.busyPart || null, 'aria-label': `Swap ${title.toLowerCase()} for another take`, text: 'Swap', onclick: () => swapPart(part) }))),
    body,

}

/* What the engine will use: the plan's engine groups, the one place engine names are shown. */
function engineUsesEl(engine) {
  const groups = ENGINE_GROUPS.filter(([k]) => Array.isArray(engine?.[k]) && engine[k].length);
  if (!groups.length) return null;
  const el = ENGINE_USES || h('section', { class: 'engine-uses', id: 'engine-uses', 'aria-labelledby': 'eu-h' });
  el.hidden = false;
  el.replaceChildren(
    h('h2', { class: 'h3', id: 'eu-h', text: 'What the engine will use' }),
    h('p', { class: 'small muted', text: "Every name below already exists in your studio's libraries." }),
    h('div', { class: 'engine' }, groups.map(([k, label]) => h('div', { class: 'eng' },
      h('h3', {}, label, h('span', { text: String(engine[k].length) })),
      h('ul', {}, engine[k].map((n) => h('li', { text: String(n) })))))));
  return el;
}

/* Suggested for this brief: styles_suggest when connected (it adds the studio's memory), else suggest() here. */
let sugTimer = null;
let sugSeq = 0;
function refreshSuggestionsSoon() {
  if (!canPaint) return;
  clearTimeout(sugTimer);
  sugTimer = setTimeout(() => { refreshSuggestions(); }, 400);
}
async function refreshSuggestions() {
  const text = currentWords().trim();
  const understood = state.understood || {};
  const seq = ++sugSeq;
  let list = null;
  if (text) {
    if (state.host === 'ready' && state.mcp) {
      try {
        const r = await read(() => connector.suggest({ text, understood, ...(state.job ? { job: state.job } : {}) }));
        if (Array.isArray(r?.suggestions)) list = r.suggestions.map((x) => ({ id: x.id, reason: x.reason }));
      } catch { list = null; }
    }
    if (!list && state.lib.status === 'ready' && state.lib.suggest) {
      list = state.lib.suggest.suggest(state.lib.all, { text, understood, picked: state.picks.map((p) => p.id), n: 6 }).map((x) => ({ id: x.id, reason: x.reason }));
    }
  }
  if (seq !== sugSeq) return;
  state.suggestions = list || [];
  paintSuggest();
}
function paintSuggest() {
  if (!canPaint) return;
  const el = $('#suggest');
  el.hidden = false;
  const list = state.suggestions.map((x) => ({ e: entryOf(x.id), reason: x.reason })).filter((x) => x.e);
  el.innerHTML = `<h3 class="h3" id="sug-h">Suggested for this brief</h3>${list.length
    ? `<div class="suggest-grid">${list.map((x) => cardHTML(x.e, x.reason)).join('')}</div>`
    : `<div class="empty"><strong>Nothing to suggest yet</strong><span>${state.lib.status === 'ready' ? 'Write a line about your video and the studio points at styles that fit it.' : 'The suggestions come once the library has loaded.'}</span></div>`}`;
  watchClips(el);
}

/* ---------- Start: render first, then light up what this view can use ---------- */

document.getElementById('home').addEventListener('click', goHome);
document.addEventListener('click', () => { state.engaged = true; rewordIdeas(); }, { capture: true, once: true });
render();

const claudeApi = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
if (!claudeApi) enterNoHost();
else {
  claudeApi.use('db').then((db) => { state.db = db || null; if (state.host === 'none') { watchSaved(); render(); } }).catch(() => {});
  claudeApi.use('sample').then((s) => { state.sample = s || null; rewordIdeas(); }).catch(() => {});
  mcpReady = claudeApi.use('mcp').then(async (mcp) => {
    if (!mcp) { enterNoHost(); return; }
    state.mcp = mcp; state.host = 'ready'; render();
    await loadContext();
  }).catch(() => enterNoHost());
}
